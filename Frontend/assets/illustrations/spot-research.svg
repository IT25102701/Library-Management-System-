<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="600" height="460"><defs>
<linearGradient id="peri" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9FB0FF"/><stop offset="1" stop-color="#6F7DFF"/></linearGradient>
<linearGradient id="vio" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C3A6FF"/><stop offset="1" stop-color="#7B5BF0"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE0A0"/><stop offset="1" stop-color="#E0A447"/></linearGradient>
<linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8FF2DA"/><stop offset="1" stop-color="#2FB596"/></linearGradient>
<linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F4FF"/><stop offset="1" stop-color="#D9DDF7"/></linearGradient>
<linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A3473"/><stop offset="1" stop-color="#151D45"/></linearGradient>
<radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#A383FF" stop-opacity=".55"/><stop offset="1" stop-color="#A383FF" stop-opacity="0"/></radialGradient>
<radialGradient id="halogold" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F0C36A" stop-opacity=".6"/><stop offset="1" stop-color="#F0C36A" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0B1028" flood-opacity=".45"/></filter>
</defs>
